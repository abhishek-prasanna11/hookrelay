spring:
  application:
    name: hookrelay-worker

  datasource:
    url: jdbc:postgresql://localhost:5432/hookrelay
    username: hookrelay
    password: hookrelay

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    # The API owns the schema. The worker validates its mappings against whatever the API migrated
    # and refuses to start if they disagree, but never applies migrations itself — two services
    # racing to migrate the same database is a deadlock waiting for a deploy.
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # The broker holds each message as unacknowledged until the worker says otherwise, so a
        # crash mid-delivery means redelivery rather than loss. Automatic acknowledgement would
        # consider a message delivered the moment it hit the socket.
        acknowledge-mode: manual
        # Deliberately small. Delivery is slow, I/O-bound work; a large prefetch just lets one
        # worker hoard a backlog while other replicas idle, which would undermine the queue-depth
        # autoscaling in phase 8.
        prefetch: 8
        concurrency: 4
        max-concurrency: 8

hookrelay:
  security:
    # See the same key in the API's configuration. Both services must agree, or an endpoint the API
    # accepts would be refused at delivery time (or worse, the reverse).
    allow-private-destinations: false

  delivery:
    connect-timeout-ms: 5000
    # Total budget for the whole exchange. Java's HttpClient has no separate socket-read timeout,
    # so this is what bounds an endpoint that trickles one byte at a time.
    request-timeout-ms: 15000
    # Matches the CHECK constraint on delivery_attempts.response_body.
    max-response-bytes: 512
    user-agent: HookRelay/0.1

  isolation:
    # A delivery put back for lack of an endpoint permit does not consume an attempt, so the loop
    # needs its own bound. 50 deferrals is roughly 100 seconds of waiting, after which it becomes a
    # CAPACITY failure on the (already bounded) retry ladder.
    max-deferrals: 50

  circuit-breaker:
    # Consecutive, not cumulative: an endpoint that fails occasionally and recovers should never
    # trip. Only an unbroken run indicates it is actually down.
    failure-threshold: 5
    # Shorter than the 2-minute gap before attempt 4, so a recovering endpoint is probed while it
    # still has attempts left.
    cooldown-ms: 30000

# Prometheus scrapes rather than being pushed to, so the worker needs an HTTP server despite being
# queue-driven background work. On its own port, so delivery load and scrape traffic stay separate,
# and so the Kubernetes probes in phase 7 have somewhere to live.
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.abhishek.hookrelay: INFO
