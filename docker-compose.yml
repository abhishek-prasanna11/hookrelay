services:
  postgres:
    image: postgres:16-alpine
    container_name: hookrelay-postgres
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    ports:
      - "5432:5432"
    volumes:
      - hookrelay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hookrelay-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI, guest/guest
    volumes:
      - hookrelay-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hookrelay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hookrelay-promdata:/prometheus
    extra_hosts:
      # Scrape targets are the API and worker running on the host, not in compose.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hookrelay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - hookrelay-grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  hookrelay-pgdata:
  hookrelay-rabbitdata:
  hookrelay-promdata:
  hookrelay-grafanadata:
