apiVersion: 1

providers:
  # Provisioned from a file rather than clicked together in the UI, so the dashboard is reviewable,
  # diffable, and survives the container being recreated.
  - name: hookrelay
    orgId: 1
    folder: HookRelay
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
