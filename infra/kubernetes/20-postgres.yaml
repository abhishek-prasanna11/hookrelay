# A single-replica PostgreSQL with a PVC. Deliberately not production shape: no replication, no
# backups, no operator. The point of this cluster is to demonstrate the application's behaviour under
# deployment and load, not to run a database well.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: hookrelay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hookrelay
spec:
  replicas: 1
  strategy:
    # Never two PostgreSQL pods sharing one ReadWriteOnce volume, even briefly during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: hookrelay-secrets
          env:
            # The image initialises into a subdirectory so it does not have to own lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hookrelay
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
